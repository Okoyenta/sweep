[package]
name = "sweep"
version = "0.9.0"
edition = "2024"

[profile.dev]
debug = false
split-debuginfo = "off"

[profile.test]
debug = false

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

[dependencies]
anyhow = "1.0.104"
byte-unit = "5.2.5"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
jwalk = "0.9.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39.6"
toml = "0.8.19"
trash = "5.2.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_RestartManager", "Win32_Storage_FileSystem", "Win32_System_IO"] }
