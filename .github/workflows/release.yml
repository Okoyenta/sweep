name: Release

on:
  push:
    tags: ['v*']

# The repo default for GITHUB_TOKEN is read-only, which makes creating a release
# fail with 403. Grant write only to the jobs that actually publish assets.
permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --locked
      - name: Rename artifact
        run: cp target/release/sweep sweep-linux-x64
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: sweep-linux-x64

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # -j 2 avoids the AV/linker races documented in the constitution.
      - name: Build release
        run: cargo build --release --locked -j 2
      - name: Rename artifact
        run: copy target\release\sweep.exe sweep-windows-x64.exe
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: sweep-windows-x64.exe

  manifests:
    # Manifests reference the published Windows binary, so they wait for it.
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      url: ${{ steps.meta.outputs.url }}
      sha256: ${{ steps.meta.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and hash
        id: meta
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/sweep-windows-x64.exe"
          # Retry: the asset can take a moment to become downloadable.
          for attempt in 1 2 3 4 5; do
            if curl -sSfL -o sweep-windows-x64.exe "$URL"; then break; fi
            sleep 10
          done
          SHA256="$(sha256sum sweep-windows-x64.exe | cut -d' ' -f1 | tr 'a-f' 'A-F')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Generate winget manifests
        run: |
          set -euo pipefail
          DIR="manifests/winget"
          mkdir -p "$DIR"
          VERSION="${{ steps.meta.outputs.version }}"
          cat > "$DIR/Okoyenta.Sweep.yaml" <<EOF
          PackageIdentifier: Okoyenta.Sweep
          PackageVersion: $VERSION
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          EOF
          cat > "$DIR/Okoyenta.Sweep.locale.en-US.yaml" <<EOF
          PackageIdentifier: Okoyenta.Sweep
          PackageVersion: $VERSION
          PackageLocale: en-US
          Publisher: Okoyenta
          PackageName: sweep
          License: MIT
          ShortDescription: Monitor and free disk space and RAM
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          EOF
          cat > "$DIR/Okoyenta.Sweep.installer.yaml" <<EOF
          PackageIdentifier: Okoyenta.Sweep
          PackageVersion: $VERSION
          InstallerType: portable
          # winget ignores PortableCommandAlias for a single-file portable —
          # it only reads that field from NestedInstallerFiles, i.e. for
          # archive-based portables. The Links alias is resolved from
          # Commands, else --rename, else the downloaded file's name; without
          # Commands the command installs as \`sweep-windows-x64\`.
          Commands:
            - sweep
          Installers:
            - Architecture: x64
              InstallerUrl: ${{ steps.meta.outputs.url }}
              InstallerSha256: ${{ steps.meta.outputs.sha256 }}
          ManifestType: installer
          ManifestVersion: 1.6.0
          EOF

      - name: Generate scoop manifest
        run: |
          set -euo pipefail
          mkdir -p manifests/scoop
          cat > manifests/scoop/sweep.json <<EOF
          {
            "version": "${{ steps.meta.outputs.version }}",
            "description": "Monitor and free disk space and RAM",
            "homepage": "https://github.com/${GITHUB_REPOSITORY}",
            "license": "MIT",
            "architecture": {
              "64bit": {
                "url": "${{ steps.meta.outputs.url }}",
                "hash": "${{ steps.meta.outputs.sha256 }}"
              }
            },
            "bin": [["sweep-windows-x64.exe", "sweep"]],
            "checkver": "github",
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v\$version/sweep-windows-x64.exe"
                }
              }
            }
          }
          EOF

      # Shared with the publish jobs so the manifest is generated exactly once.
      - name: Upload manifests as artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: manifests/

      - name: Attach manifests to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manifests/winget/Okoyenta.Sweep.yaml
            manifests/winget/Okoyenta.Sweep.locale.en-US.yaml
            manifests/winget/Okoyenta.Sweep.installer.yaml
            manifests/scoop/sweep.json

  publish-winget:
    # Opens a PR against microsoft/winget-pkgs so `winget install` works.
    # Skips silently when WINGET_TOKEN is not configured — see docs/DISTRIBUTION.md.
    needs: manifests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check for submission token
        id: gate
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "${WINGET_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=winget skipped::WINGET_TOKEN secret is not set; no winget-pkgs PR was opened. See docs/DISTRIBUTION.md."
          fi

      - name: Download manifests
        if: steps.gate.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: package-manifests
          path: manifests

      - name: Submit to winget-pkgs
        if: steps.gate.outputs.ready == 'true'
        # Publishing is best-effort: the release binaries are already attached,
        # and a submission hiccup must not mark the whole release failed.
        continue-on-error: true
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          # First-party Microsoft tool; avoids depending on a third-party action.
          curl.exe -L -o wingetcreate.exe https://aka.ms/wingetcreate/latest
          # `submit` takes the manifests the `manifests` job already generated.
          # Unlike `update`, it works for a package that is not yet in
          # winget-pkgs, so the first release needs no manual step.
          .\wingetcreate.exe submit `
            --token $env:WINGET_TOKEN `
            --prtitle "Okoyenta.Sweep ${{ needs.manifests.outputs.version }}" `
            manifests/winget

  publish-scoop:
    # Pushes the manifest into the scoop bucket repo so `scoop install` works.
    # Skips silently when SCOOP_BUCKET_TOKEN is not configured.
    needs: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for bucket token
        id: gate
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -n "${SCOOP_BUCKET_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=scoop skipped::SCOOP_BUCKET_TOKEN secret is not set; the scoop bucket was not updated. See docs/DISTRIBUTION.md."
          fi

      - name: Download manifests
        if: steps.gate.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: package-manifests
          path: manifests

      - name: Check out scoop bucket
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SCOOP_BUCKET_REPO || format('{0}-bucket', github.repository) }}
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: bucket-repo

      - name: Commit manifest to bucket
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p bucket-repo/bucket
          cp manifests/scoop/sweep.json bucket-repo/bucket/sweep.json
          cd bucket-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- bucket/sweep.json; then
            echo "bucket manifest already up to date"
            exit 0
          fi
          git add bucket/sweep.json
          git commit -m "sweep ${{ needs.manifests.outputs.version }}"
          git push

  publish-npm:
    # Publishes the CLI so `npm install -g @okoyenta/sweep` works.
    # Skips silently when NPM_TOKEN is not configured — see docs/DISTRIBUTION.md.
    needs: [build-linux, build-windows, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for npm token
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=npm skipped::NPM_TOKEN secret is not set; the package was not published. See docs/DISTRIBUTION.md."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Fetch release binaries
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # Retry: the assets can take a moment to become downloadable.
          for attempt in 1 2 3 4 5; do
            if curl -sSfL -o npm/sweep-win32-x64/sweep.exe "$BASE/sweep-windows-x64.exe"; then break; fi
            sleep 10
          done
          for attempt in 1 2 3 4 5; do
            if curl -sSfL -o npm/sweep-linux-x64/sweep "$BASE/sweep-linux-x64"; then break; fi
            sleep 10
          done
          # A retry loop that never succeeds leaves the file absent, which
          # `set -e` does not catch inside an `if`; assert the downloads landed.
          test -s npm/sweep-win32-x64/sweep.exe
          test -s npm/sweep-linux-x64/sweep
          # npm preserves the mode it packs, and the launcher execs this directly.
          chmod +x npm/sweep-linux-x64/sweep

      - name: Stamp version from the tag
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # The tag is the single source of truth: the repo keeps 0.0.0
          # placeholders so there is no second version to forget.
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            const edit = (file, mutate) => {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              mutate(json);
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            };
            edit("npm/sweep/package.json", (json) => {
              json.version = version;
              for (const name of Object.keys(json.optionalDependencies)) {
                json.optionalDependencies[name] = version;
              }
            });
            edit("npm/sweep-win32-x64/package.json", (json) => { json.version = version; });
            edit("npm/sweep-linux-x64/package.json", (json) => { json.version = version; });
          ' "${{ needs.manifests.outputs.version }}"

      - name: Publish to npm
        if: steps.gate.outputs.ready == 'true'
        # Best-effort like the other publish jobs: the release assets are already
        # attached, so a registry hiccup must not mark the release failed.
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Platform packages first: the launcher's optionalDependencies point
          # at them, and npm resolves those when the launcher is installed.
          for dir in npm/sweep-win32-x64 npm/sweep-linux-x64 npm/sweep; do
            echo "publishing $dir"
            (cd "$dir" && npm publish --access public)
          done
